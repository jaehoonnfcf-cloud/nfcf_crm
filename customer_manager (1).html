<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Customer List</h1>
        <div id="customerTable" class="bg-white p-6 rounded-lg shadow">
            Initializing...
        </div>
    </div>

    <script>
        // 1. 여기에 본인의 값을 정확히 넣으세요
        const SUPABASE_URL = 'https://neepcdiumutjjwuxzjyt.supabase.co/rest/v1/'; 
        const SUPABASE_KEY = 'sb_publishable_V3QNk17RFVKkJcSYq6ny0Q_QJ56FpOX';

        console.log("Script starting...");
        
        try {
            const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log("Supabase client created");

            async function fetchCustomers() {
                const display = document.getElementById('customerTable');
                display.innerHTML = "Fetching from Supabase...";
                
                try {
                    console.log("Calling Supabase...");
                    const { data, error } = await supabase.from('customers').select('*');
                    
                    if (error) {
                        console.error("Supabase Error:", error);
                        display.innerHTML = '<p class="text-red-500">Error: ' + error.message + '</p>';
                        return;
                    }
                    
                    if (!data || data.length === 0) {
                        display.innerHTML = "No data found in 'customers' table.";
                        return;
                    }

                    display.innerHTML = "Data loaded! Check console for details.";
                    console.log("Data:", data);
                } catch (e) {
                    console.error("Fetch Exception:", e);
                    display.innerHTML = '<p class="text-red-500">Exception: ' + e.message + '</p>';
                }
            }
            
            fetchCustomers();
        } catch (e) {
            document.getElementById('customerTable').innerHTML = "Initialization Error: " + e.message;
        }
    </script>
</body>
</html>
