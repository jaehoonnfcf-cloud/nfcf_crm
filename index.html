<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>고객정보 관리</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="고객정보 관리" />
<meta name="theme-color" content="#ebedec" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --ink:#151a18; --paper:#ebedec; --panel:#fff; --line:#eceeed; --muted:#7a827f; --field:#f4f5f5;
    --accent:#e04e18; --accent-hover:#c7410f; --accent-soft:#fdece4; --danger:#d63a3a; --danger-soft:#fdeaea;
    --side-w:268px; --bar-h:68px; --gap:18px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--paper); color:var(--ink); overflow:hidden; letter-spacing:-0.01em;
    font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif; }
  button, input{ font-family:inherit; font-size:15px; color:var(--ink); }
  a{ color:inherit; text-decoration:none; }

  /* 로그인 */
  .login-wrap{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px; background:var(--paper); z-index:100; }
  .login-card{ background:#fff; border-radius:28px; padding:40px 34px; width:100%; max-width:360px; text-align:center; box-shadow:0 20px 60px rgba(20,30,25,.12); }
  .mark{ width:48px; height:48px; border-radius:15px; background:var(--accent); color:#fff; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; font-size:24px; }
  .login-card h1{ font-size:21px; margin:0 0 6px; letter-spacing:-.02em; }
  .login-card p{ color:var(--muted); font-size:13.5px; margin:0 0 24px; line-height:1.5; }
  .google-btn{ width:100%; padding:12px 16px; border-radius:14px; border:none; background:var(--field); font-size:14.5px; font-weight:700; cursor:pointer; }
  .google-btn:hover{ background:#e9ecea; }
  .login-error{ margin-top:16px; font-size:12.5px; color:var(--danger); display:none; }

  /* 셸 레이아웃 */
  #shell{ display:none; height:100vh; height:100dvh; padding:var(--gap) 22px 18px; gap:var(--gap) 22px;
    grid-template-columns:var(--side-w) minmax(0,1fr); grid-template-rows:var(--bar-h) minmax(0,1fr); }
  .topbar{ grid-column:1 / -1; grid-row:1; display:flex; align-items:center; gap:16px; background:#fff; border-radius:26px; padding:10px 14px 10px 16px; min-width:0; }
  .brand{ display:flex; align-items:center; gap:12px; width:calc(var(--side-w) - 30px); flex-shrink:0; font-weight:800; font-size:16px; white-space:nowrap; }
  .brand .mark{ margin:0; width:42px; height:42px; border-radius:14px; font-size:20px; }
  .menu-btn{ display:none; border:0; background:var(--field); width:42px; height:42px; border-radius:14px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .gsearch{ flex:1; max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px; background:var(--field); border-radius:999px; padding:0 18px; height:46px; min-width:0; }
  .gsearch input{ flex:1; border:0; background:transparent; outline:none; font-size:14.5px; height:100%; min-width:0; }
  .gsearch .ic{ opacity:.55; }
  .profile{ display:flex; align-items:center; gap:11px; padding:5px 16px 5px 6px; border-radius:999px; background:var(--field); margin-left:auto; flex-shrink:0; }
  .gsearch + .profile{ margin-left:0; }
  .av{ width:36px; height:36px; border-radius:50%; background:var(--accent); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .pn{ line-height:1.2; font-weight:800; font-size:14px; white-space:nowrap; } .pn small{ display:block; color:var(--muted); font-weight:600; font-size:11.5px; }

  .side{ grid-column:1; grid-row:2; background:#fff; border-radius:26px; padding:16px 14px 14px; display:flex; flex-direction:column; gap:3px; overflow-y:auto; min-height:0; }
  .nav-label{ font-size:12px; font-weight:700; color:#9aa19e; padding:14px 12px 6px; }
  .nav-label:first-child{ padding-top:4px; }
  .nav{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:11px 14px; border-radius:14px; color:#2a302d; font-size:14.5px; font-weight:600; border:0; background:transparent; cursor:pointer; }
  .nav:hover{ background:#f3f5f4; }
  .nav.active{ background:var(--accent); color:#fff; font-weight:700; }
  .nav .e{ width:20px; text-align:center; }
  .nav.logout{ margin-top:auto; background:var(--danger-soft); color:var(--danger); font-weight:700; }
  .nav.logout:hover{ background:#fbdcdc; }

  .stage{ grid-column:2; grid-row:2; position:relative; min-width:0; min-height:0; border-radius:26px; overflow:hidden; }
  #view{ width:100%; height:100%; border:0; display:block; background:transparent; }
  .loading{ position:absolute; left:0; right:0; top:0; height:3px; background:transparent; overflow:hidden; opacity:0; transition:opacity .15s; pointer-events:none; z-index:5; }
  .loading.on{ opacity:1; }
  .loading::before{ content:''; position:absolute; inset:0; width:35%; background:var(--accent); border-radius:3px; animation:slide 1s infinite ease-in-out; }
  @keyframes slide{ from{ transform:translateX(-100%); } to{ transform:translateX(300%); } }
  .scrim{ display:none; }

  @media (max-width:960px){
    #shell{ grid-template-columns:minmax(0,1fr); grid-template-rows:var(--bar-h) minmax(0,1fr); padding:10px 10px 0; gap:10px; }
    .menu-btn{ display:flex; align-items:center; justify-content:center; }
    .brand{ width:auto; flex:1; }
    .gsearch{ display:none; }
    .profile{ padding:5px; } .profile .pn{ display:none; }
    .stage{ grid-column:1; border-radius:22px 22px 0 0; }
    .side{ position:fixed; top:0; bottom:0; left:0; width:min(300px, 84vw); border-radius:0 26px 26px 0; z-index:60; transform:translateX(-105%); transition:transform .22s ease; padding-top:max(16px, env(safe-area-inset-top)); box-shadow:0 20px 60px rgba(20,30,25,.25); }
    body.drawer .side{ transform:none; }
    body.drawer .scrim{ display:block; position:fixed; inset:0; background:rgba(21,26,24,.45); z-index:50; }
  }
</style>
</head>
<body>
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="mark">🗂️</div>
    <h1>고객정보 관리</h1>
    <p>승인된 Google 계정으로 로그인해주세요.</p>
    <button class="google-btn" id="googleLoginBtn">Google 계정으로 로그인</button>
    <div class="login-error" id="loginError">로그인에 실패했습니다. 다시 시도해 주세요.</div>
  </div>
</div>

<div id="shell">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">☰</button>
    <div class="brand"><div class="mark">🗂️</div><span>고객정보 관리</span></div>
    <form class="gsearch" id="gsearch" autocomplete="off"><span class="ic">🔍</span><input type="search" id="gsearchInput" placeholder="고객번호 · 성명 · 고객정보 검색 후 Enter" aria-label="고객 검색" /></form>
    <div class="profile"><span class="av" id="avatar"></span><span class="pn"><span id="pname"></span><small id="prole"></small></span></div>
  </div>
  <nav class="side" id="side" aria-label="메뉴"></nav>
  <div class="stage">
    <div class="loading" id="loading"></div>
    <iframe id="view" title="화면"></iframe>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<script>
  const SUPABASE_URL = "https://neepcdiumutjjwuxzjyt.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_V3QNk17RFVKkJcSYq6ny0Q_QJ56FpOX";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 메뉴 구성 (새 화면을 추가하려면 여기에 한 줄만 넣으면 됩니다)
  const MENU = [
    { group: '내 고객', items: [['home.html', '📊', '내 고객 현황판'], ['customers.html', '🗂️', '고객정보 관리'], ['staff-dashboard.html', '🙋', '전담고객 관리'], ['managed-customers.html', '👥', '전체 관리 고객']] },
    { group: '수신 · 실적', items: [['vip.html', '🏛️', '법인단체등 만기관리'], ['special-deposit.html', '🏦', '특판 실적'], ['rates.html', '📈', '타행금리조회']] },
    { group: '관리', admin: true, items: [['customer-assignment.html', '🗂️', '배정관리'], ['admin.html', '⚙️', '관리자']] },
  ];
  const ALIAS = { 'customer-detail.html': 'staff-dashboard.html' };         // 고객 상세는 "전담고객 관리" 메뉴에 속한 것으로 표시
  const ALLOWED = new Set(MENU.flatMap(g => g.items.map(i => i[0])).concat(Object.keys(ALIAS)));
  const $ = (id) => document.getElementById(id);
  const view = $('view');
  let isAdmin = false, currentUserName = '', booted = false;

  // ---- 로그인 ----
  $('googleLoginBtn').addEventListener('click', async () => {
    $('loginError').style.display = 'none'; $('googleLoginBtn').disabled = true;
    try { if (location.hash && !/access_token|error/.test(location.hash)) sessionStorage.setItem('nfcf_next', location.hash); } catch (e) {}
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error){ $('googleLoginBtn').disabled = false; $('loginError').textContent = '로그인 실패: ' + error.message; $('loginError').style.display = 'block'; }
  });
  async function logout(){ await sb.auth.signOut(); showLogin(); }

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'TOKEN_REFRESHED') return;
    if (session) handleSession(session, event === 'SIGNED_IN'); else showLogin();
  });
  async function handleSession(session, shouldLog){
    if (booted) return;
    const { data: allowed, error } = await sb.rpc('is_allowed_email');
    if (error || !allowed){
      if (shouldLog) await sb.rpc('log_login', { p_success: false, p_reason: 'not_allowed' });
      await sb.auth.signOut(); showLogin();
      $('loginError').textContent = '이 Google 계정은 접근이 허용되지 않았습니다. 관리자에게 문의해주세요.'; $('loginError').style.display = 'block';
      return;
    }
    if (shouldLog) await sb.rpc('log_login', { p_success: true });
    booted = true; boot(session);
  }
  function showLogin(){
    booted = false; $('shell').style.display = 'none'; $('loginScreen').style.display = 'flex'; $('googleLoginBtn').disabled = false;
    view.src = 'about:blank';
  }

  // ---- 화면 구성 ----
  async function boot(session){
    const [{ data: name }, { data: admin }] = await Promise.all([sb.rpc('current_user_name'), sb.rpc('is_admin')]);
    isAdmin = !!admin; currentUserName = name || session.user.email;
    $('pname').textContent = currentUserName; $('avatar').textContent = currentUserName.charAt(0); $('prole').textContent = isAdmin ? '관리자' : '담당자';
    buildMenu();
    $('loginScreen').style.display = 'none'; $('shell').style.display = 'grid';
    let target = parseHash(location.hash);
    if (!target){ try { target = parseHash(sessionStorage.getItem('nfcf_next') || ''); sessionStorage.removeItem('nfcf_next'); } catch (e) {} }
    go(target || 'home.html', true);
  }
  function buildMenu(){
    $('side').innerHTML = MENU.filter(g => !g.admin || isAdmin).map(g =>
      `<div class="nav-label">${g.group}</div>` + g.items.map(([p, e, t]) => `<a class="nav" href="#${p}" data-p="${p}"><span class="e">${e}</span>${t}</a>`).join('')).join('')
      + `<button class="nav logout" id="logoutBtn"><span class="e">🚪</span>로그아웃</button>`;
    $('logoutBtn').addEventListener('click', logout);
    $('side').querySelectorAll('a.nav').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.p); closeDrawer(); }));
  }

  // 해시(#파일명.html?쿼리) → 허용된 화면 경로만 통과
  function parseHash(h){
    h = (h || '').replace(/^#/, ''); if (!h || /access_token|error_description/.test(h)) return null;
    const file = h.split('?')[0];
    if (!ALLOWED.has(file)) return null;
    if ((file === 'admin.html' || file === 'customer-assignment.html') && !isAdmin) return null;
    return h;
  }
  function go(path, replace){
    const p = parseHash(path) || 'home.html';
    $('loading').classList.add('on');
    let actual = ''; try { const l = view.contentWindow.location; actual = l.pathname.split('/').pop() + l.search; } catch (e) {}
    if (actual === p) view.contentWindow.location.reload(); else view.src = p;
    markActive(p.split('?')[0]);
    try { history[replace ? 'replaceState' : 'pushState'](null, '', '#' + p); } catch (e) {}
  }
  function markActive(file){
    const f = ALIAS[file] || file;
    $('side').querySelectorAll('a.nav').forEach(a => a.classList.toggle('active', a.dataset.p === f));
  }
  // 화면 안에서 다른 화면으로 이동(고객 상세 등)해도 메뉴·주소가 따라가도록
  view.addEventListener('load', () => {
    $('loading').classList.remove('on');
    try {
      const loc = view.contentWindow.location, file = loc.pathname.split('/').pop();
      if (!file || !ALLOWED.has(file)) return;
      markActive(file);
      history.replaceState(null, '', '#' + file + loc.search);
      const t = view.contentDocument.title; if (t) document.title = t + ' · 고객정보 관리';
    } catch (e) {}
  });
  window.addEventListener('hashchange', () => { const p = parseHash(location.hash); if (p && booted) go(p, true); });
  window.addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.type === 'nfcf-login-needed') logout(); });

  // 상단 검색 → 고객정보 검색
  $('gsearch').addEventListener('submit', (e) => { e.preventDefault(); const q = $('gsearchInput').value.trim(); if (q){ go('customers.html?q=' + encodeURIComponent(q)); $('gsearchInput').blur(); } });

  // 모바일 메뉴
  const closeDrawer = () => document.body.classList.remove('drawer');
  $('menuBtn').addEventListener('click', () => document.body.classList.toggle('drawer'));
  $('scrim').addEventListener('click', closeDrawer);
</script>
</body>
</html>
